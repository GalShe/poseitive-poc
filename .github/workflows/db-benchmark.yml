# משווה PostgreSQL ל-MongoDB על אותם נתונים ואותן שאילתות, ושומר את התוצאה ב-results/db_benchmark.json.
# רץ אוטומטית כשמשנים משהו ב-db/, או ידנית מלשונית Actions.
name: DB benchmark

on:
  push:
    branches: [main]
    paths: ["db/**", ".github/workflows/db-benchmark.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poseitive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run benchmark
        run: |
          python db/benchmark.py \
            --pg "postgresql://postgres:postgres@localhost:5432/poseitive" \
            --mongo "mongodb://localhost:27017"
      - name: Refresh POC summary
        run: python analysis/run_poc.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results web/results
          git diff --cached --quiet || git commit -m "DB benchmark results [skip ci]"
          git push

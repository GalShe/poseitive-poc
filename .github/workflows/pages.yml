# מפרסם את אפליקציית ה-POC (תיקיית web/) ל-GitHub Pages בכל דחיפה ל-main.
# הגדרה חד-פעמית בריפו: Settings → Pages → Source: GitHub Actions
name: Deploy POC web app

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["DB benchmark"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run browser logic tests
        run: node web/tests/core.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
